name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: python -m compileall -q agent bridge prompts main.py config.py sse_utils.py
      - run: pytest -q --cov=agent --cov=bridge --cov=sse_utils --cov-report=term-missing --cov-fail-under=75
